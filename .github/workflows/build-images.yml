name: Build planet images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      filter:
        description: "Optional substring to limit which images build (e.g. java_25)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/stellarstackoss/planets

jobs:
  # Walk the tree, find every Dockerfile, and emit a matrix of
  #   { tag, context, file }
  # entries. The image is always `${IMAGE}` (single GHCR package); the
  # tag is the directory path with `/` → `_` (e.g. `java/21` → `java_21`,
  # `games/rust` → `games_rust`).
  #
  # Build context is picked per-Dockerfile:
  #   - if the Dockerfile uses `./../` (shared entrypoint a level up),
  #     context = parent of the Dockerfile's directory
  #   - otherwise, context = the Dockerfile's own directory
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          set -euo pipefail
          filter='${{ github.event.inputs.filter }}'
          json='[]'
          while IFS= read -r dockerfile; do
            dir="${dockerfile%/Dockerfile}"
            dir="${dir#./}"
            tag="${dir//\//_}"
            if [ -n "$filter" ] && [[ "$tag" != *"$filter"* ]]; then
              continue
            fi
            if grep -q '\./\.\./' "$dockerfile"; then
              # `COPY ./../something` — needs the parent directory in
              # the context so the `..` lookup lands inside it.
              context="$(dirname "$dir")"
            else
              context="$dir"
            fi
            file="$dir/Dockerfile"
            json=$(echo "$json" | jq \
              --arg t "$tag" \
              --arg c "$context" \
              --arg f "$file" \
              '. + [{"tag": $t, "context": $c, "file": $f}]')
          done < <(find . -name Dockerfile -not -path './.git/*' | sort)
          echo "matrix=$(echo "$json" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "$json" | jq .

  build:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        entry: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          short="${GITHUB_SHA::7}"
          echo "tags=${IMAGE}:${{ matrix.entry.tag }},${IMAGE}:${{ matrix.entry.tag }}-${short}" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.entry.context }}
          file: ${{ matrix.entry.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Per-tag registry cache so each planet's incremental rebuilds
          # are cheap without one planet evicting another's layers.
          cache-from: type=registry,ref=${{ env.IMAGE }}:${{ matrix.entry.tag }}-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:${{ matrix.entry.tag }}-buildcache,mode=max
          provenance: false
