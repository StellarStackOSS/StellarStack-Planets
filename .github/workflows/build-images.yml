name: Build planet images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      filter:
        description: "Optional substring to limit which images build (e.g. java/21)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  # Walk the tree, find every Dockerfile, and emit a matrix of
  # { context, image } pairs. Each entry maps to one buildx job that
  # publishes a multi-arch (amd64 + arm64) image to GHCR under the
  # repo's namespace, e.g. `java/21/Dockerfile` →
  #   ghcr.io/<owner>/<repo>/java/21:latest
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          set -euo pipefail
          repo_lc="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          filter='${{ github.event.inputs.filter }}'
          entries=$(find . -name Dockerfile -not -path './.git/*' \
            | sed 's|^\./||; s|/Dockerfile$||' \
            | sort)
          json='[]'
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            if [ -n "$filter" ] && [[ "$dir" != *"$filter"* ]]; then
              continue
            fi
            image="ghcr.io/${repo_lc}/${dir}"
            json=$(echo "$json" | jq --arg c "$dir" --arg i "$image" \
              '. + [{"context": $c, "image": $i}]')
          done <<< "$entries"
          echo "matrix=$(echo "$json" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "$json" | jq .

  build:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        entry: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          short="${GITHUB_SHA::7}"
          echo "tags=${{ matrix.entry.image }}:latest,${{ matrix.entry.image }}:${short}" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.entry.context }}
          file: ${{ matrix.entry.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Reuse the image's previous build as a cache mount so subsequent
          # runs only rebuild what changed in that planet's Dockerfile.
          cache-from: type=registry,ref=${{ matrix.entry.image }}:buildcache
          cache-to: type=registry,ref=${{ matrix.entry.image }}:buildcache,mode=max
          provenance: false
